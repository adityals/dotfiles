onboarding = false

[theme]
name = "terminal"
auto_switch = false

[terminal]
new_cwd = "follow"

[ui]
accent = "blue"
prompt_new_tab_name = false

[keys]
prefix = "ctrl+b"

# --- ported custom tmux.conf ---
split_horizontal = 'prefix+"'
split_vertical = "prefix+%"
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# --- tmux defaults ---
detach = "prefix+d"
workspace_picker = "prefix+w"
goto = "prefix+s"
rename_workspace = "prefix+$"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
rename_tab = "prefix+comma"
close_tab = "prefix+&"
last_pane = "prefix+;"
new_tab = "" # replaced by custom command below: new tabs start in $HOME
new_workspace = ""   # replaced by custom command below: new workspaces start in $HOME
cycle_pane_next = "prefix+o"
resize_pane_left = "prefix+alt+left"
resize_pane_down = "prefix+alt+down"
resize_pane_up = "prefix+alt+up"
resize_pane_right = "prefix+alt+right"

settings = "prefix+shift+s"
open_notification_target = "prefix+shift+o"

# new tab in $HOME; splits/workspaces keep new_cwd = "follow"
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "\"$HERDR_BIN_PATH\" tab create --cwd \"$HOME\" --focus"
description = "new tab in home"

# new workspace in $HOME
[[keys.command]]
key = "prefix+shift+n"
type = "popup"
command = 'printf "Workspace name: "; read n && "$HERDR_BIN_PATH" workspace create --cwd "$HOME" ${n:+--label "$n"} --focus >/dev/null'
width = "40%"
height = 5
description = "new workspace in home"
