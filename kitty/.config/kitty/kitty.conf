# keep alacritty's TERM; avoids missing xterm-kitty terminfo over ssh
term xterm-256color

# font
font_family      JetBrainsMono Nerd Font Mono
font_size        15
disable_ligatures never
# extra line spacing eases long reading
modify_font cell_height 110%

# colors: picked from wallpaper/1.png (navy night sky, amber lamps, neon pink, cyan reflections)
# tuned for all-day reading: softer navy, fg ~11:1 contrast (not pure white), muted accents
foreground           #cfcbd8
background           #141a26
cursor               #f2b766
cursor_text_color    #141a26
selection_foreground none
selection_background #2a3550
# alacritty draws untagged (display-native) colors; srgb looks duller on P3 macbook screens
macos_colorspace default
# black: deep navy / slate
color0  #1e2534
color8  #646f8a
# red: tower glow
color1  #d77278
color9  #e68a8f
# green: lamp-lit foliage
color2  #a3bd78
color10 #b9d092
# yellow: street lamps
color3  #e8b673
color11 #f5cb92
# blue: dusk sky
color4  #7895d0
color12 #95aee3
# magenta: neon signs
color5  #c67ab8
color13 #d999cd
# cyan: wet road reflections
color6  #6bbac6
color14 #8ccfd8
# white: cool lavender
color7  #bfbccb
color15 #e4e1ec

# window
macos_option_as_alt     yes
hide_window_decorations titlebar-only
background_opacity      0.95
background_blur         0
window_padding_width    10
remember_window_size    no

# mouse
mouse_hide_wait -1

# keys
map cmd+n           new_os_window
map alt+space       send_text all \x20
map cmd+backspace   send_text all \x15
map alt+left        send_text all \x1bb
map alt+right       send_text all \x1bf
map cmd+left        send_text normal,application \x1bOH
map cmd+right       send_text normal,application \x1bOF
